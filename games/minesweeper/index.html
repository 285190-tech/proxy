<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minesweeper — Neon Vault</title>
<meta name="description" content="Play Minesweeper in the Neon Vault browser arcade: read the numbers, flag the mines, never trust a cell. Keyboard and touch.">
<meta name="theme-color" content="#0b0714">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/game.css">
<style>
.ms-wrap { display:flex; flex-direction:column; gap:12px; align-items:center; }
.ms-difficulty { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.ms-chip {
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px;
  background:var(--panel-2); color:var(--text); border:1px solid var(--line);
  border-radius:999px; padding:9px 16px; min-height:40px; cursor:pointer; transition:all .15s ease;
}
.ms-chip[aria-pressed="true"] { background:var(--amber); border-color:var(--amber); color:#241300; box-shadow:0 0 14px rgba(255,194,71,.4); }
.ms-grid {
  display:grid; gap:4px; justify-content:center;
  grid-auto-rows:1fr;
}
.ms-cell {
  width:var(--cell, 36px); height:var(--cell, 36px);
  background:linear-gradient(180deg,#262048,#1b1733); border:1px solid #37305f; border-radius:6px;
  color:var(--text); font-family:'Press Start 2P',monospace; font-size:12px;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background .12s ease, transform .12s ease; padding:0; user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
.ms-cell:hover { background:linear-gradient(180deg,#322a5e,#241f44); }
.ms-cell.is-open { background:#0d0a1e; border-color:#241f44; cursor:default; }
.ms-cell.is-flag { color:var(--amber); text-shadow:0 0 8px rgba(255,194,71,.7); }
.ms-cell.is-mine { background:#3a0d18; border-color:#ff4d5e; }
.ms-cell.is-wrong { background:#2c2407; border-color:#ffc247; }
.ms-cell .n1{color:#00e5ff}.ms-cell .n2{color:#a6ff3f}.ms-cell .n3{color:#ffc247}.ms-cell .n4{color:#ff2ea6}.ms-cell .n5{color:#ff4d5e}.ms-cell .n6{color:#b26bff}.ms-cell .n7{color:#ff9f1c}.ms-cell .n8{color:#eceaff}
.ms-flagmode[aria-pressed="true"] { background:var(--amber); border-color:var(--amber); color:#241300; }
</style>
</head>
<body class="game-page" data-game="minesweeper">
<header class="chrome">
  <a class="chrome-logo" href="../../index.html" aria-label="Back to Neon Vault"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#151027"/><g fill="#ff2ea6"><rect x="6" y="9" width="3" height="3"/><rect x="23" y="9" width="3" height="3"/><rect x="9" y="12" width="14" height="3"/><rect x="6" y="12" width="3" height="3"/><rect x="23" y="12" width="3" height="3"/><rect x="9" y="18" width="3" height="3"/><rect x="20" y="18" width="3" height="3"/><rect x="6" y="21" width="3" height="3"/><rect x="14" y="18" width="4" height="3"/><rect x="23" y="21" width="3" height="3"/></g></svg>NEON&nbsp;<em>VAULT</em></a>
  <div class="chrome-game">MINESWEEPER</div>
  <div class="chrome-actions">
    <button class="icon-btn" id="muteBtn" aria-pressed="false" aria-label="Toggle sound" title="Sound on/off"><svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="M15.5 9.5a4 4 0 0 1 0 5M18.5 6.5a8.5 8.5 0 0 1 0 11"/></svg><svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="m16 9.5 5 5m0-5-5 5"/></svg></button>
  </div>
</header>
<main class="game-main">
  <div class="game-hud">
    <div class="hud-item">TIME<span id="time">0</span></div>
    <div class="hud-item hud-item--magenta">MINES LEFT<span id="minesLeft">10</span></div>
    <div class="hud-item">BEST<span id="best">0</span></div>
    <div class="hud-actions">
      <button class="nv-btn nv-btn--ghost ms-flagmode" id="flagModeBtn" type="button" aria-pressed="false">DIG MODE</button>
      <button class="nv-btn" id="restartBtn" type="button">RESTART</button>
    </div>
  </div>
  <div class="stage stage--pad" id="stage">
    <div class="ms-wrap">
      <div class="ms-difficulty" role="group" aria-label="Difficulty">
        <button class="ms-chip" data-diff="cadet" aria-pressed="true" type="button">CADET · 9×9</button>
        <button class="ms-chip" data-diff="veteran" aria-pressed="false" type="button">VETERAN · 12×12</button>
        <button class="ms-chip" data-diff="legend" aria-pressed="false" type="button">LEGEND · 16×16</button>
      </div>
      <div class="ms-grid" id="grid" role="grid" aria-label="Minefield"></div>
    </div>
    <div class="stage-overlay" id="overlay" role="dialog" aria-label="Game state">
      <h2 class="overlay-title" id="overlayTitle">CLEAR!</h2>
      <p class="overlay-sub" id="overlaySub">Every mine flagged by logic, not luck.</p>
      <p class="overlay-score" id="overlayScore"></p>
      <button class="nv-btn" id="overlayBtn" type="button">PLAY AGAIN</button>
    </div>
  </div>
  <p class="game-help"><kbd>Click</kbd> dig · <kbd>Right-click</kbd> flag · long-press or FLAG MODE on touch · first dig is always safe · <kbd>R</kbd> restart.</p>
</main>
<script src="../../assets/js/audio.js"></script>
<script src="../../assets/js/nv.js"></script>
<script src="minesweeper.js"></script>
</body>
</html>
