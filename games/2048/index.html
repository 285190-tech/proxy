<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 — Neon Vault</title>
<meta name="description" content="Slide and merge glowing tiles to 2048. One greedy move ruins the whole board. Keyboard, swipe and touch.">
<meta name="theme-color" content="#0b0714">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/game.css">
<style>
.g2048-board {
  position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
  width:min(340px, 88vw); aspect-ratio:1; padding:10px; background:#0a0716;
  border-radius:14px; border:1px solid var(--line);
}
.g2048-cell { background:#171230; border-radius:10px; }
.g2048-tile {
  width:100%; height:100%; display:flex; align-items:center; justify-content:center;
  border-radius:10px; font-family:'Press Start 2P',monospace; font-weight:400;
  font-size:clamp(15px,5vw,21px); box-shadow:inset 0 -3px 0 rgba(0,0,0,.28);
}
.g2048-tile.is-new { animation:tilePop .18s ease; }
.g2048-tile.is-merge { animation:tileMerge .22s ease; z-index:2; }
@keyframes tilePop { 0% { transform:scale(.3); opacity:0; } 70% { transform:scale(1.18); } 100% { transform:scale(1); opacity:1; } }
@keyframes tileMerge { 0% { filter:brightness(1.6); } 100% { filter:brightness(1); } }
.t2{background:#221d3d;color:#eceaff}.t4{background:#2e2752;color:#eceaff}
.t8{background:#0a7c8c;color:#c9fbff}.t16{background:#00b8d4;color:#032830}.t32{background:#00e5ff;color:#032830;box-shadow:0 0 14px rgba(0,229,255,.45),inset 0 -3px 0 rgba(0,0,0,.28)}
.t64{background:#a6ff3f;color:#122600;box-shadow:0 0 14px rgba(166,255,63,.45),inset 0 -3px 0 rgba(0,0,0,.28)}
.t128{background:#ffd23f;color:#2e1c00;font-size:clamp(13px,4.4vw,18px);box-shadow:0 0 14px rgba(255,210,63,.45),inset 0 -3px 0 rgba(0,0,0,.28)}
.t256{background:#ffc247;color:#2e1c00;font-size:clamp(13px,4.4vw,18px);box-shadow:0 0 16px rgba(255,194,71,.5),inset 0 -3px 0 rgba(0,0,0,.28)}
.t512{background:#ff9f1c;color:#2e1200;font-size:clamp(13px,4.4vw,18px);box-shadow:0 0 16px rgba(255,159,28,.5),inset 0 -3px 0 rgba(0,0,0,.28)}
.t1024{background:#ff2ea6;color:#2e0018;font-size:clamp(11px,3.6vw,15px);box-shadow:0 0 18px rgba(255,46,166,.55),inset 0 -3px 0 rgba(0,0,0,.28)}
.t2048{background:linear-gradient(135deg,#ffd23f,#ff2ea6);color:#2e0018;font-size:clamp(11px,3.6vw,15px);box-shadow:0 0 26px rgba(255,210,63,.65),inset 0 -3px 0 rgba(0,0,0,.28)}
.tsuper{background:#ff4d5e;color:#2e0008;font-size:clamp(10px,3.2vw,13px);box-shadow:0 0 26px rgba(255,77,94,.65),inset 0 -3px 0 rgba(0,0,0,.28)}
</style>
</head>
<body class="game-page" data-game="2048">
<header class="chrome">
  <a class="chrome-logo" href="../../index.html" aria-label="Back to Neon Vault"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#151027"/><g fill="#ff2ea6"><rect x="6" y="9" width="3" height="3"/><rect x="23" y="9" width="3" height="3"/><rect x="9" y="12" width="14" height="3"/><rect x="6" y="12" width="3" height="3"/><rect x="23" y="12" width="3" height="3"/><rect x="9" y="18" width="3" height="3"/><rect x="20" y="18" width="3" height="3"/><rect x="6" y="21" width="3" height="3"/><rect x="14" y="18" width="4" height="3"/><rect x="23" y="21" width="3" height="3"/></g></svg>NEON&nbsp;<em>VAULT</em></a>
  <div class="chrome-game">2048</div>
  <div class="chrome-actions">
    <button type="button" class="icon-btn" id="muteBtn" aria-pressed="false" aria-label="Toggle sound" title="Sound on/off"><svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="M15.5 9.5a4 4 0 0 1 0 5M18.5 6.5a8.5 8.5 0 0 1 0 11"/></svg><svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="m16 9.5 5 5m0-5-5 5"/></svg></button>
  </div>
</header>
<main class="game-main">
  <div class="game-hud">
    <div class="hud-item">SCORE<span id="score">0</span></div>
    <div class="hud-item hud-item--magenta">BEST<span id="best">0</span></div>
    <div class="hud-item">TOP TILE<span id="topTile">—</span></div>
    <div class="hud-actions">
      <button class="nv-btn" id="restartBtn" type="button">RESTART</button>
    </div>
  </div>
  <div class="stage stage--pad" id="stage">
    <div class="g2048-board" id="board" role="group" aria-label="2048 board">
      <div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div>
      <div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div>
      <div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div>
      <div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div><div class="g2048-cell"></div>
    </div>
    <div class="stage-overlay" id="overlay" role="dialog" aria-label="Game state">
      <h2 class="overlay-title" id="overlayTitle">2048!</h2>
      <p class="overlay-sub" id="overlaySub">You forged the ultimate tile.</p>
      <p class="overlay-score" id="overlayScore"></p>
      <button class="nv-btn" id="overlayBtn" type="button">KEEP GOING</button>
    </div>
  </div>
  <div class="touch-controls" data-desktop-hide="true" role="group" aria-label="Touch controls">
    <button type="button" class="touch-btn" data-dir="up" aria-label="Slide up"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 14 7-7 7 7"/></svg></button>
    <button type="button" class="touch-btn" data-dir="left" aria-label="Slide left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg></button>
    <button type="button" class="touch-btn" data-dir="down" aria-label="Slide down"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 10 7 7 7-7"/></svg></button>
    <button type="button" class="touch-btn" data-dir="right" aria-label="Slide right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5l7 7-7 7"/></svg></button>
  </div>
  <p class="game-help"><kbd>←→↑↓</kbd> / <kbd>WASD</kbd> slide · swipe on the board · merge matching tiles to reach <strong>2048</strong> · <kbd>R</kbd> restart.</p>
</main>
<script src="../../assets/js/audio.js"></script>
<script src="../../assets/js/nv.js"></script>
<script src="game2048.js"></script>
</body>
</html>
