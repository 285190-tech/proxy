<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Match — Neon Vault</title>
<meta name="description" content="Flip neon glyph cards and find every pair. How sharp is your recall? Keyboard and touch.">
<meta name="theme-color" content="#0b0714">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/game.css">
<style>
.mm-wrap { display:flex; flex-direction:column; gap:12px; align-items:center; }
.mm-difficulty { display:flex; gap:8px; }
.mm-chip {
  font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:12px;
  background:var(--panel-2); color:var(--text); border:1px solid var(--line);
  border-radius:999px; padding:9px 16px; min-height:40px; cursor:pointer; transition:all .15s ease;
}
.mm-chip[aria-pressed="true"] { background:var(--cyan); border-color:var(--cyan); color:#032830; box-shadow:0 0 14px rgba(0,229,255,.4); }
.mm-grid { display:grid; gap:10px; grid-template-columns:repeat(4, minmax(0, 72px)); }
.mm-card {
  width:100%; aspect-ratio:3/4; perspective:600px; border:none; background:transparent; cursor:pointer; padding:0;
  -webkit-tap-highlight-color:transparent;
}
.mm-card-inner {
  position:relative; width:100%; height:100%; transform-style:preserve-3d;
  transition:transform .38s cubic-bezier(.2,.9,.3,1.2);
}
.mm-card.is-up .mm-card-inner { transform:rotateY(180deg); }
.mm-face {
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:12px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line);
}
.mm-back {
  background:repeating-linear-gradient(45deg,#1b1733 0 8px,#221d3d 8px 16px);
  box-shadow:inset 0 0 18px rgba(0,229,255,.08);
}
.mm-back::after {
  content:""; width:26%; aspect-ratio:1; border-radius:50%;
  border:2px solid var(--magenta); box-shadow:0 0 12px rgba(255,46,166,.55);
}
.mm-front {
  background:#0d0a1e; transform:rotateY(180deg);
  box-shadow:inset 0 0 18px rgba(0,229,255,.12);
}
.mm-card.is-matched .mm-front { border-color:var(--lime); box-shadow:0 0 16px rgba(166,255,63,.4), inset 0 0 18px rgba(166,255,63,.18); }
.mm-front svg { width:46%; height:46%; filter:drop-shadow(0 0 8px currentColor); }
@media (max-width:480px) { .mm-grid { grid-template-columns:repeat(4, minmax(0, 62px)); gap:8px; } }
</style>
</head>
<body class="game-page" data-game="memory-match">
<header class="chrome">
  <a class="chrome-logo" href="../../index.html" aria-label="Back to Neon Vault"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#151027"/><g fill="#ff2ea6"><rect x="6" y="9" width="3" height="3"/><rect x="23" y="9" width="3" height="3"/><rect x="9" y="12" width="14" height="3"/><rect x="6" y="12" width="3" height="3"/><rect x="23" y="12" width="3" height="3"/><rect x="9" y="18" width="3" height="3"/><rect x="20" y="18" width="3" height="3"/><rect x="6" y="21" width="3" height="3"/><rect x="14" y="18" width="4" height="3"/><rect x="23" y="21" width="3" height="3"/></g></svg>NEON&nbsp;<em>VAULT</em></a>
  <div class="chrome-game">MEMORY MATCH</div>
  <div class="chrome-actions">
    <button class="icon-btn" id="muteBtn" aria-pressed="false" aria-label="Toggle sound" title="Sound on/off"><svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="M15.5 9.5a4 4 0 0 1 0 5M18.5 6.5a8.5 8.5 0 0 1 0 11"/></svg><svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="m16 9.5 5 5m0-5-5 5"/></svg></button>
  </div>
</header>
<main class="game-main">
  <div class="game-hud">
    <div class="hud-item">MOVES<span id="moves">0</span></div>
    <div class="hud-item">TIME<span id="time">0</span></div>
    <div class="hud-item hud-item--magenta">BEST<span id="best">0</span></div>
    <div class="hud-actions">
      <button class="nv-btn" id="restartBtn" type="button">RESTART</button>
    </div>
  </div>
  <div class="stage stage--pad" id="stage">
    <div class="mm-wrap">
      <div class="mm-difficulty" role="group" aria-label="Difficulty">
        <button class="mm-chip" data-mode="rookie" type="button" aria-pressed="true">ROOKIE · 6 PAIRS</button>
        <button class="mm-chip" data-mode="master" type="button" aria-pressed="false">MASTER · 8 PAIRS</button>
      </div>
      <div class="mm-grid" id="grid" aria-label="Memory cards"></div>
    </div>
    <div class="stage-overlay" id="overlay" role="dialog" aria-label="Game state">
      <h2 class="overlay-title overlay-title--cyan" id="overlayTitle">ALL PAIRS!</h2>
      <p class="overlay-sub" id="overlaySub">Photographic. Absolutely unsettling.</p>
      <p class="overlay-score" id="overlayScore"></p>
      <button class="nv-btn" id="overlayBtn" type="button">PLAY AGAIN</button>
    </div>
  </div>
  <p class="game-help"><kbd>Tap / click</kbd> flip a card · match all pairs · fewer moves and less time means a bigger score · <kbd>R</kbd> restart.</p>
</main>
<script src="../../assets/js/audio.js"></script>
<script src="../../assets/js/nv.js"></script>
<script src="memory-match.js"></script>
</body>
</html>
