<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whack-a-Mole — Neon Vault</title>
<meta name="description" content="Forty-five seconds, nine holes, zero mercy. Golden moles pay double; bombs cost you. Keyboard-free mayhem on touch and mouse.">
<meta name="theme-color" content="#0b0714">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/game.css">
<style>
.wm-field { display:grid; grid-template-columns:repeat(3, minmax(0, 96px)); gap:14px; }
.wm-hole {
  position:relative; width:100%; aspect-ratio:1; border:none; cursor:pointer; border-radius:18px;
  background:radial-gradient(ellipse at 50% 78%, #050310 0 42%, transparent 43%),
             radial-gradient(ellipse at 50% 100%, #171231 0 62%, transparent 63%),
             linear-gradient(180deg,#151030,#1d1836);
  border:1px solid var(--line); overflow:hidden; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
.wm-hole:active { transform:scale(.96); }
.wm-mole {
  position:absolute; left:50%; bottom:-8%; width:72%; aspect-ratio:1; transform:translate(-50%, 110%);
  transition:transform .16s cubic-bezier(.2,1.4,.4,1); pointer-events:none;
}
.wm-hole.is-up .wm-mole { transform:translate(-50%, 8%); }
.wm-mole svg { width:100%; height:100%; filter:drop-shadow(0 0 10px rgba(166,255,63,.35)); }
.wm-hole.is-golden .wm-mole svg { filter:drop-shadow(0 0 12px rgba(255,210,63,.75)); }
.wm-hole.is-bomb .wm-mole svg { filter:drop-shadow(0 0 12px rgba(255,77,94,.75)); }
.wm-hole.is-hit .wm-mole { transform:translate(-50%, 8%) scale(.82); transition:transform .1s ease; }
.wm-flash { animation:wmFlash .25s ease; }
@keyframes wmFlash { 0% { box-shadow:0 0 0 3px var(--red), 0 0 30px rgba(255,77,94,.6); } 100% { box-shadow:none; } }
@media (max-width:480px) { .wm-field { grid-template-columns:repeat(3, minmax(0, 78px)); gap:10px; } }
</style>
</head>
<body class="game-page" data-game="whack-a-mole">
<header class="chrome">
  <a class="chrome-logo" href="../../index.html" aria-label="Back to Neon Vault"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#151027"/><g fill="#ff2ea6"><rect x="6" y="9" width="3" height="3"/><rect x="23" y="9" width="3" height="3"/><rect x="9" y="12" width="14" height="3"/><rect x="6" y="12" width="3" height="3"/><rect x="23" y="12" width="3" height="3"/><rect x="9" y="18" width="3" height="3"/><rect x="20" y="18" width="3" height="3"/><rect x="6" y="21" width="3" height="3"/><rect x="14" y="18" width="4" height="3"/><rect x="23" y="21" width="3" height="3"/></g></svg>NEON&nbsp;<em>VAULT</em></a>
  <div class="chrome-game">WHACK-A-MOLE</div>
  <div class="chrome-actions">
    <button class="icon-btn" id="muteBtn" aria-pressed="false" aria-label="Toggle sound" title="Sound on/off"><svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="M15.5 9.5a4 4 0 0 1 0 5M18.5 6.5a8.5 8.5 0 0 1 0 11"/></svg><svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="m16 9.5 5 5m0-5-5 5"/></svg></button>
  </div>
</header>
<main class="game-main">
  <div class="game-hud">
    <div class="hud-item">SCORE<span id="score">0</span></div>
    <div class="hud-item hud-item--magenta">BEST<span id="best">0</span></div>
    <div class="hud-item">TIME<span id="time">45</span></div>
    <div class="hud-actions">
      <button class="nv-btn" id="restartBtn" type="button">RESTART</button>
    </div>
  </div>
  <div class="stage stage--pad" id="stage">
    <div class="wm-field" id="field" role="group" aria-label="Mole holes"></div>
    <div class="stage-overlay" id="overlay" role="dialog" aria-label="Game state">
      <h2 class="overlay-title" id="overlayTitle">WHACK-A-MOLE</h2>
      <p class="overlay-sub" id="overlaySub">45 seconds. Moles +10, golden +30, bombs −25. Go.</p>
      <p class="overlay-score" id="overlayScore"></p>
      <button class="nv-btn" id="overlayBtn" type="button">START ROUND</button>
    </div>
  </div>
  <p class="game-help"><kbd>Tap / click</kbd> a mole · golden moles are worth +30 · bombs cost 25 · 45 seconds, fastest hammer wins · <kbd>R</kbd> restart.</p>
</main>
<script src="../../assets/js/audio.js"></script>
<script src="../../assets/js/nv.js"></script>
<script src="whack-a-mole.js"></script>
</body>
</html>
