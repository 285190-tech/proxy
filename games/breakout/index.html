<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout — Neon Vault</title>
<meta name="description" content="Play Breakout in the Neon Vault browser arcade: shatter the brick wall with one ball and a neon paddle. Keyboard, mouse and touch.">
<meta name="theme-color" content="#0b0714">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/game.css">
</head>
<body class="game-page" data-game="breakout">
<header class="chrome">
  <a class="chrome-logo" href="../../index.html" aria-label="Back to Neon Vault"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#151027"/><g fill="#ff2ea6"><rect x="6" y="9" width="3" height="3"/><rect x="23" y="9" width="3" height="3"/><rect x="9" y="12" width="14" height="3"/><rect x="6" y="12" width="3" height="3"/><rect x="23" y="12" width="3" height="3"/><rect x="9" y="18" width="3" height="3"/><rect x="20" y="18" width="3" height="3"/><rect x="6" y="21" width="3" height="3"/><rect x="14" y="18" width="4" height="3"/><rect x="23" y="21" width="3" height="3"/></g></svg>NEON&nbsp;<em>VAULT</em></a>
  <div class="chrome-game">BREAKOUT</div>
  <div class="chrome-actions">
    <button class="icon-btn" id="muteBtn" aria-pressed="false" aria-label="Toggle sound" title="Sound on/off"><svg class="icon-sound-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="M15.5 9.5a4 4 0 0 1 0 5M18.5 6.5a8.5 8.5 0 0 1 0 11"/></svg><svg class="icon-sound-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M11 5 6.5 9H3v6h3.5L11 19V5z" fill="currentColor" stroke="none"/><path d="m16 9.5 5 5m0-5-5 5"/></svg></button>
  </div>
</header>
<main class="game-main">
  <div class="game-hud">
    <div class="hud-item">SCORE<span id="score">0</span></div>
    <div class="hud-item hud-item--magenta">BEST<span id="best">0</span></div>
    <div class="hud-item">LIVES<span id="lives">3</span></div>
    <div class="hud-item">WAVE<span id="wave">1</span></div>
    <div class="hud-actions">
      <button class="nv-btn nv-btn--ghost" id="pauseBtn" type="button">PAUSE</button>
      <button class="nv-btn" id="restartBtn" type="button">RESTART</button>
    </div>
  </div>
  <div class="stage" id="stage">
    <canvas id="gameCanvas" width="480" height="360" role="application" aria-label="Breakout playfield" style="width:min(480px,94vw);height:auto;"></canvas>
    <div class="stage-overlay" id="overlay" role="dialog" aria-label="Game state">
      <h2 class="overlay-title" id="overlayTitle">READY?</h2>
      <p class="overlay-sub" id="overlaySub">Move the paddle, launch the ball, break the wall.</p>
      <p class="overlay-score" id="overlayScore"></p>
      <button class="nv-btn" id="overlayBtn" type="button">LAUNCH</button>
    </div>
  </div>
  <div class="touch-controls" data-desktop-hide="true" aria-label="Touch controls">
    <button class="touch-btn" data-act="left" aria-label="Paddle left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l-7 7 7 7"/></svg></button>
    <button class="touch-btn touch-btn--wide" data-act="launch" aria-label="Launch ball">LAUNCH</button>
    <button class="touch-btn" data-act="right" aria-label="Paddle right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5l7 7-7 7"/></svg></button>
  </div>
  <p class="game-help"><kbd>←→</kbd> / mouse / drag to move · <kbd>Space</kbd> launch · <kbd>P</kbd> pause · <kbd>R</kbd> restart.</p>
</main>
<script src="../../assets/js/audio.js"></script>
<script src="../../assets/js/nv.js"></script>
<script src="breakout.js"></script>
</body>
</html>
